name: Release

# Tag-triggered mobile release:
#   git tag v0.1.0 && git push --tags
# iOS  → signed .ipa → TestFlight (App Store Connect)
# Android → signed .aab → Google Play internal testing track
# Both also attach the artifact to a draft GitHub Release for QA/sideload.
#
# All signing/upload steps are gated on their secrets being present, so
# the workflow degrades to "build + attach artifact" until you provision
# the store credentials. Required secrets are documented in docs/RELEASE.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ios:
    name: iOS to TestFlight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: npm ci

      - name: Generate iOS project
        run: npm run tauri ios init

      # Automatic signing via an App Store Connect API key. Tauri picks
      # these up and signs the .ipa for App Store distribution.
      - name: Build signed .ipa
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ github.workspace }}/asc_api_key.p8
        run: |
          if [ -z "$APPLE_API_ISSUER" ]; then
            echo "No App Store Connect secrets set — building unsigned and skipping upload."
            npm run tauri ios build -- --ci || true
            exit 0
          fi
          echo "${{ secrets.APPLE_API_KEY_P8 }}" | base64 --decode > "$APPLE_API_KEY_PATH"
          npm run tauri ios build -- --export-method app-store-connect

      - name: Upload to TestFlight
        if: ${{ secrets.APPLE_API_ISSUER != '' }}
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          IPA=$(find src-tauri/gen/apple/build -name "*.ipa" | head -n1)
          echo "Uploading $IPA to TestFlight"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"

      - name: Attach .ipa to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: src-tauri/gen/apple/build/**/*.ipa
          fail_on_unmatched_files: false

  android:
    name: Android to Play internal
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK + platform
        run: sdkmanager "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: npm ci

      - name: Generate Android project
        run: npm run tauri android init -- --skip-targets-install
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125

      # Write the upload keystore + signing config from secrets so the
      # release build is signed. Skipped (unsigned) when no keystore secret.
      - name: Configure signing
        if: ${{ secrets.ANDROID_KEY_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEY_BASE64 }}" | base64 --decode > src-tauri/gen/android/keystore.jks
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=keystore.jks
          storePassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build .aab
        run: npm run tauri android build -- --aab
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125

      - name: Upload to Play internal track
        if: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.exfer.wallet
          releaseFiles: src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          track: internal

      - name: Attach .aab/.apk to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          fail_on_unmatched_files: false
