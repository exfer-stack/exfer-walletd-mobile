name: Release

# Tag-triggered mobile release:
#   git tag v0.1.0 && git push --tags
# iOS  → signed .ipa → TestFlight (App Store Connect)
# Android → signed .aab → Google Play internal testing track
# Both also attach the artifact to a draft GitHub Release for QA/sideload.
#
# All signing/upload steps are gated on their secrets being present, so
# the workflow degrades to "build + attach artifact" until you provision
# the store credentials. Required secrets are documented in docs/RELEASE.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ios:
    name: iOS to TestFlight
    runs-on: macos-latest
    # secrets can't be referenced in `if:` directly, so surface them as
    # env once at the job level and gate steps on env.* below.
    env:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: npm ci

      - name: Generate iOS project
        run: npm run tauri ios init

      # Automatic signing via an App Store Connect API key. Tauri picks
      # these up and signs the .ipa for App Store distribution.
      - name: Build signed .ipa
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ github.workspace }}/asc_api_key.p8
        run: |
          if [ -z "$APPLE_API_ISSUER" ]; then
            echo "No App Store Connect secrets set — building unsigned and skipping upload."
            npm run tauri ios build -- --ci || true
            exit 0
          fi
          echo "${{ secrets.APPLE_API_KEY_P8 }}" | base64 --decode > "$APPLE_API_KEY_PATH"
          npm run tauri ios build -- --export-method app-store-connect

      - name: Upload to TestFlight
        if: ${{ env.APPLE_API_ISSUER != '' }}
        run: |
          IPA=$(find src-tauri/gen/apple/build -name "*.ipa" | head -n1)
          echo "Uploading $IPA to TestFlight"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"

      # Only attach the iOS build when it's actually signed — an unsigned
      # .ipa can't be installed, so without Apple secrets we skip it and let
      # the Android job own the published release.
      - name: Attach .ipa to GitHub Release
        if: ${{ env.APPLE_API_ISSUER != '' }}
        uses: softprops/action-gh-release@v2
        with:
          name: "exfer wallet ${{ github.ref_name }}"
          files: src-tauri/gen/apple/build/**/*.ipa
          fail_on_unmatched_files: false

  android:
    name: Android to Play internal
    runs-on: ubuntu-22.04
    env:
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      # The .aab bundles all ABIs of the embedded-walletd native lib; free
      # preinstalled tooling so the native-lib merge doesn't run the runner
      # out of disk.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      # Use the runner's preinstalled NDK (Tauri auto-detects it).
      - name: Install Android platform + build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: npm ci

      - name: Generate Android project
        run: npm run tauri android init -- --skip-targets-install

      # Write the upload keystore + signing config from secrets so the
      # release build is signed. Skipped (unsigned) when no keystore secret.
      - name: Configure signing
        if: ${{ env.ANDROID_KEY_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEY_BASE64" | base64 --decode > src-tauri/gen/android/keystore.jks
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=keystore.jks
          storePassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      # With a keystore: a signed release .aab (Play) + a signed universal
      # .apk people can sideload directly.
      - name: Build signed .aab + .apk
        if: ${{ env.ANDROID_KEY_BASE64 != '' }}
        run: npm run tauri android build -- --aab --apk

      # Without a keystore (no secrets yet): a debug-signed arm64 .apk so
      # testers can install it now. Debug is self-signed by the SDK, so it
      # installs without provisioning a release key; arm64 covers ~all
      # modern phones and keeps the build inside the runner's disk.
      - name: Build installable debug .apk (arm64)
        if: ${{ env.ANDROID_KEY_BASE64 == '' }}
        run: npm run tauri android build -- --apk --debug --target aarch64

      - name: Upload to Play internal track
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.exfer.wallet
          releaseFiles: src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          track: internal

      - name: Attach .aab/.apk to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "exfer wallet ${{ github.ref_name }}"
          body: |
            Mobile wallet for the Exfer blockchain (iOS + Android).

            **Android:** download the `.apk` below and install it — see
            [docs/INSTALL.md](https://github.com/exfer-stack/exfer-walletd-mobile/blob/main/docs/INSTALL.md).
            **iOS:** sideloading isn't possible; an App Store / TestFlight
            build follows once signing is provisioned.
          files: |
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          fail_on_unmatched_files: false
