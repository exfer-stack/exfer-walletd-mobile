name: CI

# On every push/PR only the frontend gate (tsc + vite build) runs — cheap
# and fast. The native iOS/Android compile-checks are expensive (macOS is
# billed 10x), so they don't run on push: real native builds happen on a
# tag via release.yml, and these checks are available on demand from the
# Actions tab (Run workflow / workflow_dispatch).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (tsc + vite build)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  android-build:
    name: Android build-check (debug APK)
    # Native builds happen on tags (release.yml). On push/PR only the
    # frontend gate runs; this compile-check is on demand only.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # The embedded walletd makes the debug .so large; building all 4 ABIs
      # overflows the runner's ~14GB disk (mergeNativeLibs: "No space left
      # on device"). Reclaim ~25GB of preinstalled tooling first.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      # Use the runner's preinstalled NDK (Tauri auto-detects it); don't
      # download a second NDK — saves disk + time.
      - name: Install Android platform + build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: npm ci
      - name: Generate Android project
        run: npm run tauri android init -- --skip-targets-install
      # `init` ships placeholder Tauri icons; regenerate the launcher icons
      # from the exfer brand mark.
      - name: Brand launcher icons
        run: npm run tauri icon src-tauri/icons/icon.png
      # Single ABI (arm64) for the check — enough to prove it compiles +
      # links, and keeps the native-lib merge under the disk limit.
      - name: Build debug APK (arm64)
        run: npm run tauri android build -- --apk --debug --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore

  ios-build:
    name: iOS build-check (compile)
    # macOS minutes are billed 10x; don't burn them on every push. Run this
    # iOS compile check on demand only (Actions tab -> Run workflow).
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: npm ci
      - name: Generate iOS project
        run: npm run tauri ios init
      - name: Brand app icons
        run: npm run tauri icon src-tauri/icons/icon.png
      - name: Build (unsigned, simulator target)
        # No signing on PRs — just prove it compiles + links for iOS.
        run: npm run tauri ios build -- --target aarch64-sim --ci
