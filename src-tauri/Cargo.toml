[package]
name        = "exfer-walletd-mobile"
version     = "1.0.22"
description = "Mobile (iOS + Android) wallet for exfer. Embeds walletd in-process; one app → balance / receive / send / keyring management, keys never leave the device."
edition     = "2021"
license     = "MIT"

[lib]
# The `_lib` suffix avoids a Windows-only conflict between the lib and
# bin names (see https://github.com/rust-lang/cargo/issues/8519).
# crate-type covers every target: staticlib (iOS), cdylib (Android +
# desktop plugin), rlib (the desktop bin in main.rs).
name        = "exfer_walletd_mobile_lib"
crate-type  = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri              = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
# Open the release .apk URL in the system browser for in-app updates — the
# mobile WebView's window.open is a no-op, which forced a copy-link fallback.
tauri-plugin-opener = "2"
# Native clipboard. The web Clipboard API (navigator.clipboard) is undefined in
# the Android WebView's non-secure-context (tauri://), so every copy button —
# including the recovery-phrase / private-key export — silently no-op'd. This
# plugin copies natively on Android/iOS/desktop.
tauri-plugin-clipboard-manager = "2"
# Filesystem read/write. Works on all targets (desktop + mobile); the
# JS side does the actual file I/O so export/import works on iOS + Android
# where dialog.save() is unavailable.
tauri-plugin-fs = "2"

# Produce the official Exfer CLI "wallet.key" (EXFK) format for
# per-address export: Argon2id KDF + AES-256-GCM, byte-identical to the
# exfer crate's Wallet::save_encrypted so exfer.dev / the CLI import it.
argon2             = "0.5"
aes-gcm            = "0.10"
rand               = "0.8"
tokio              = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tokio-util         = { version = "0.7", features = ["rt"] }

# In-app CPU miner so the agent can self-fund by mining EXFER on-device (no
# downloaded binary, no subprocess — iOS/Android sandboxes forbid both). Pure
# Rust: exfer-pow is Argon2id only (cross-compiles to aarch64-android cleanly);
# exfer-stratum is rustls+ring (the same TLS stack reqwest already pulls in).
# GPU/CUDA is NOT enabled — the default build is CPU-only, "runs anywhere".
exfer-pow          = { git = "https://github.com/exfer-stack/exfer-agent-miner", rev = "32db5e1" }
exfer-stratum      = { git = "https://github.com/exfer-stack/exfer-agent-miner", rev = "32db5e1" }

# The embedded walletd. Bumped 3229f1c → 5ad5ca7: journal-independent recovery
# of stranded BNB locks (buy direction) via the indexed Locked event — the BSC
# twin of the EXFER stranded-lock sweep, mainnet-proven (lock → expire → refund
# with no local record). Carries the prior chain-driven EXFER reclaim + the
# locked_expired fix. Keep desktop on the SAME rev.
exfer-walletd      = { git = "https://github.com/exfer-stack/exfer-walletd", rev = "5ad5ca7b51d423d637c7482ecd50df16dd2c7de1" }

# HTTP client used by the Tauri Rust side to talk to the embedded
# walletd over loopback HTTPS. `rustls-tls-manual-roots` disables
# webpki-roots entirely so the fingerprint verifier is the only path
# the TLS handshake can take. Works unchanged on iOS + Android.
reqwest            = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots"] }
rustls             = "0.23"
# Multi-server MCP supervisor: the built-in `exfer` server runs the exfer-mcp
# sidecar EXTERNAL against the embedded walletd, plus user-registered stdio/http
# MCP servers. Same features as desktop so the in-wallet agent has the SAME real
# path on mobile (real LLM + real exfer-mcp tools on the real embedded walletd).
rmcp               = { version = "0.15", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
# Standard CA roots for the one outbound call to a *public* host (the EXFER
# OTC price API). The walletd client stays pinned/manual-roots; this is a
# separate webpki-roots store used only by get_market_price.
webpki-roots       = "0.26"
# Parse the (optional) self-signed exfer-vote CA PEM embedded at build time so
# the governance proxy can pin it the same way walletd pins the swap-pool CA.
rustls-pemfile     = "2"
sha2               = "0.10"
hex                = "0.4"
# Mnemonic import preview: derive the standard / legacy secret for a typed
# phrase so the picker can show both candidate addresses before importing.
bip39              = "2.2"

serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
anyhow             = "1"
thiserror          = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Persist the keystore passphrase in the platform secure store. The
# `keyring` crate covers iOS (apple-native → Security.framework Keychain),
# macOS, Windows, and Linux. Android has no backend in this crate, so the
# Android target intentionally omits it and `secrets.rs` falls back to
# app-private storage (the Android per-app sandbox); hardware-backed
# Android Keystore is a hardening follow-up via tauri-plugin-keystore.
# QR scanner for recipient addresses — mobile only (camera).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
# Face ID / Touch ID / fingerprint unlock — mobile-only plugin (no desktop
# backend).
tauri-plugin-biometric = "2"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

# Shrink the release binary / native libs. The embedded walletd pulls in alloy +
# rustls + reqwest + secp256k1, so the per-ABI .so is large and ships ×ABIs in
# the APK. strip drops debug symbols (the biggest single win); opt-level "s" +
# fat LTO + one codegen unit trade build time for size. panic is left as unwind
# on purpose — the walletd daemon relies on catch_unwind to survive a panicking
# request instead of taking the whole app down.
[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1
